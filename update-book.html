<form id="updateForm" onsubmit="updateBook(event)">
    <select id="bookSelect" onchange="fillForm()"></select>
    <input type="text" id="title" placeholder="Titre" required>
    <input type="text" id="author" placeholder="Auteur" required>
    <input type="date" id="published_at" required>
    <label><input type="checkbox" id="available"> Disponible</label>
    <button type="submit">Mettre à jour</button>
</form>
