<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un livre</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Ajouter un nouveau livre</h1>
    
    <form id="addBookForm">
        <div class="form-group">
            <label for="title">Titre:</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label for="author">Auteur:</label>
            <input type="text" id="author" name="author" required>
        </div>
        
        <div class="form-group">
            <label for="published_at">Date de publication:</label>
            <input type="date" id="published_at" name="published_at" required>
        </div>
        
        <div class="form-group">
            <label for="available">Disponibilité:</label>
            <select id="available" name="available">
                <option value="true" selected>Disponible</option>
                <option value="false">Indisponible</option>
            </select>
        </div>
        
        <button type="submit">Ajouter le livre</button>
        <button type="button" onclick="window.location.href='index.html'">Retour</button>
        
        <div id="message" class="message"></div>
    </form>
    
    <script>
        document.getElementById('addBookForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const published_at = document.getElementById('published_at').value;
            const available = document.getElementById('available').value === 'true';
            
            try {
                const response = await fetch('backend/add-book.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title,
                        author,
                        published_at,
                        available
                    })
                });
                
                const data = await response.json();
                
                const messageDiv = document.getElementById('message');
                if (data.success) {
                    messageDiv.textContent = 'Livre ajouté avec succès!';
                    messageDiv.className = 'success';
                    document.getElementById('addBookForm').reset();
                    
                    // Redirection après 2 secondes
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    messageDiv.textContent = 'Erreur: ' + data.message;
                    messageDiv.className = 'error';
                }
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('message').textContent = 'Une erreur est survenue';
                document.getElementById('message').className = 'error';
            }
        });
    </script>
</body>
</html>
