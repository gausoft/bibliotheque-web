<!-- Formulaire HTML pour ajouter un livre -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Livre</title>
</head>
<body>
    <h2>Ajouter un Livre à la Bibliothèque</h2>
    <form method="POST" action="">
        <label for="titre">Titre:</label><br>
        <input type="text" id="titre" name="titre" required><br><br>
        
        <label for="auteur">Auteur:</label><br>
        <input type="text" id="auteur" name="auteur" required><br><br>
        
        <label for="isbn">ISBN:</label><br>
        <input type="text" id="isbn" name="isbn" required><br><br>
        
        <label for="date_publication">Date de Publication:</label><br>
        <input type="date" id="date_publication" name="date_publication"><br><br>
        
        <label for="genre">Genre:</label><br>
        <input type="text" id="genre" name="genre"><br><br>

        <input type="submit" value="Ajouter le Livre">
    </form>
</body>
</html>
