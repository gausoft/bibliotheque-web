<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion de Bibliothèque</title>
    <script>
        async function getBooks() {
            let response = await fetch("../backend/index.php");
            let books = await response.json();
            let bookList = document.getElementById("bookList");
            bookList.innerHTML = "";
            books.forEach(book => {
                let li = document.createElement("li");
                li.innerHTML = `${book.title} - ${book.author} [${book.available ? "Disponible" : "Indisponible"}] 
                    <button onclick="deleteBook(${book.id})">❌</button>`;
                bookList.appendChild(li);
            });
        }

        async function addBook(event) {
            event.preventDefault();
            let title = document.getElementById("title").value;
            let author = document.getElementById("author").value;
            let available = document.getElementById("available").checked ? 1 : 0;

            let response = await fetch("../backend/add-book.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, author, available })
            });

            alert((await response.json()).message);
            getBooks();
        }

        async function deleteBook(id) {
            if (!confirm("Confirmer la suppression ?")) return;
            await fetch("../backend/delete-book.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id })
            });
            getBooks();
        }

        window.onload = getBooks;
    </script>
</head>
<body>
    <h2>Gestion de Bibliothèque</h2>
    <form onsubmit="addBook(event)">
        <input type="text" id="title" placeholder="Titre" required>
        <input type="text" id="author" placeholder="Auteur" required>
        <label><input type="checkbox" id="available"> Disponible</label>
        <button type="submit">Ajouter</button>
    </form>
    <h3>Liste des Livres</h3>
    <ul id="bookList"></ul>
</body>
</html>
